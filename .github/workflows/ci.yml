name: Face Audit CI

# Runs on every push and pull request to main
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:

  # ── Job 1: Code quality — runs on GitHub cloud (no models needed) ──────────
  code-check:
    name: Code Quality
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install lightweight deps (no torch/cv2)
        run: pip install mlflow dvc pandas

      - name: Syntax check — all Python files
        run: |
          python -m py_compile run_test.py
          python -m py_compile run_test_fast.py
          python -m py_compile run_test_api.py
          python -m py_compile goggles_wrapper_api.py
          python -m py_compile register_models.py
          python -m py_compile training/run_train.py
          echo "All files parse OK"

      - name: Check DVC config is valid
        run: dvc config --list

      - name: Check .dvc pointer files exist
        run: |
          test -f dataset/test.dvc
          test -f models/goggles_model.pt.dvc
          test -f models/best_convnext_large.pth.dvc
          echo "All DVC pointers present"

  # ── Job 2: Sanity check — runs on YOUR machine (self-hosted runner) ──
  # Checks imports, model files, dataset presence, and MLflow registry.
  # Runs in ~30 seconds. Full accuracy test: run run_test_fast.py locally.
  model-test:
    name: Model Sanity Check
    runs-on: self-hosted
    needs: code-check

    steps:
      - uses: actions/checkout@v4

      - name: Restore dataset from DVC
        run: |
          $py = "D:\Users\ADMIN\anaconda3\envs\face-validation\python.exe"
          Set-Location D:\audit
          & $py -m dvc pull dataset/test.dvc 2>&1

      - name: Run sanity check
        run: |
          $env:PYTHONUTF8 = "1"
          $py = "D:\Users\ADMIN\anaconda3\envs\face-validation\python.exe"
          & $py D:\audit\ci_sanity_check.py

  # ── Job 3: Docker build — runs only when model-test passes ────────────────
  docker-build:
    name: Docker Build
    runs-on: self-hosted
    needs: model-test

    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t face-audit:${{ github.sha }} -t face-audit:latest .

      - name: Smoke test the container
        run: |
          docker run -d --name ci-smoke `
            -p 8099:8000 `
            -v D:\audit\models:/app/models:ro `
            face-audit:${{ github.sha }}

          # poll up to 120 s (12 x 10 s); model load takes ~60 s on first start
          $ok = $false
          for ($i = 1; $i -le 12; $i++) {
            Start-Sleep -Seconds 10
            try {
              $r = Invoke-WebRequest -Uri http://localhost:8099/health `
                     -UseBasicParsing -ErrorAction Stop
              if ($r.StatusCode -eq 200) { $ok = $true; break }
            } catch {}
            Write-Host "  waiting… attempt $i/12"
          }
          if (-not $ok) {
            Write-Host "=== container logs ==="
            docker logs ci-smoke
            exit 1
          }
          Write-Host "Container health check passed"

      - name: Cleanup
        if: always()
        run: |
          docker stop ci-smoke 2>$null; docker rm ci-smoke 2>$null
          Write-Host "Container cleaned up"
